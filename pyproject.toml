[project]
name = "abc-gram-panchayat-portal"
version = "2.0.0"
description = "ABC Gram Panchayat Public Grievance Redressal & Citizen E-Service Portal"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
